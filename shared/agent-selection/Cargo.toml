[package]
name = "titanos-agent-selection"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "A page-hosted Office canvas reports only the selection of its bound document"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["CustomEvent", "CustomEventInit", "Element", "EventTarget", "HtmlCanvasElement"] }
